[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barlow-twins-nir"
version = "0.1.0"
description = "Barlow Twins semi-supervised learning for NIR spectroscopy"
requires-python = ">=3.9"
# Framework-agnostic base dependencies only.
# Install a backend with: pip install barlow-twins-nir[tensorflow] or [torch]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "livelossplot",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow>=2.16",
    "tensorflow-probability>=0.24",
]
torch = [
    "torch>=2.0",
]
all = [
    "tensorflow>=2.16",
    "tensorflow-probability>=0.24",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["barlow_twins_nir*"]
